name: OSV-Scanner

on:
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
  schedule:
    - cron: '40 11 * * 4'
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BLOQUANT : un constat fait échouer le contrôle au lieu d'être avalé en
      # silence (le SARIF est tout de même téléversé, via `if: always()`).
      # Les exceptions sont dans `osv-scanner.toml`, chacune motivée et datée —
      # ce n'est PAS un « continue-on-error ».
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.5
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=sarif
            --output=results.sarif
            --lockfile=package-lock.json

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: osv-scanner
