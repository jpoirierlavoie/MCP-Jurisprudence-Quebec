name: OSV-Scanner

on:
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
  schedule:
    - cron: '40 11 * * 4'
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BLOQUANT : un constat fait échouer le contrôle au lieu d'être avalé en
      # silence (le SARIF est tout de même téléversé, via `if: always()`).
      # Les exceptions sont dans `osv-scanner.toml`, chacune motivée et datée —
      # ce n'est PAS un « continue-on-error ».
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@eb5b619bb565d10623076caba5263750fde3c790 # v2.3.5
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=sarif
            --output=results.sarif
            --lockfile=package-lock.json

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
          category: osv-scanner
